<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les briques du module</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Matériel · relink · cadrage, pas décision</p>
    <h1>Les briques du module — ce que le protocole impose, ce qui reste à trancher</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relink-materiel-title relink-materiel-desc">
      <title id="relink-materiel-title">Les briques du module</title>
      <desc id="relink-materiel-desc">Cadrage matériel : la cartouche fournit l'horloge au connecteur link, une adaptation de niveau protège le microcontrôleur qui exécute le crate protocol, un journal non volatile empêche la duplication d'un échange, et une connectivité IP porte MQTT jusqu'au service. Seule la contrainte du lien est établie ; le choix de chaque composant reste ouvert, y compris l'alimentation.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone : le module -->
      <rect x="208" y="136" width="560" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="460" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="148" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MODULE</text>

      <!-- Connecteurs -->
      <line x1="176" y1="216" x2="240" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <rect x="192" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINK</text>

      <line x1="384" y1="216" x2="416" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="216" x2="592" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Microcontrôleur vers le journal -->
      <path d="M 632,256 V 268 Q 632,276 624,276 H 496 Q 488,276 488,284 V 296"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="512" y="256" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOURNALISE</text>

      <!-- Microcontrôleur vers la connectivité -->
      <line x1="664" y1="256" x2="664" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="672" y="266" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="274" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MQTT</text>

      <!-- Vers le service -->
      <line x1="736" y1="332" x2="800" y2="332" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="744" y="312" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="320" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERNET</text>

      <!-- Nœuds -->

      <!-- Cartouche : extérieur -->
      <rect x="32" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="176" width="144" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="40" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="54" y="192" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GB</text>
      <text x="104" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartouche</text>
      <text x="104" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fournit l'horloge</text>

      <!-- Connecteur link : imposé par la console -->
      <rect x="240" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="176" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="266" y="192" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="312" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Connecteur link</text>
      <text x="312" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brochage à sourcer</text>

      <!-- Adaptation de niveau : à trancher -->
      <rect x="416" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="176" width="144" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="424" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="442" y="192" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ÉLEC</text>
      <text x="488" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adaptation de niveau</text>
      <text x="488" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tensions à confirmer</text>

      <!-- Microcontrôleur : la brique focale -->
      <rect x="592" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="176" width="144" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="600" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="614" y="192" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCU</text>
      <text x="664" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Microcontrôleur</text>
      <text x="664" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exécute protocol</text>

      <!-- Journal : à trancher -->
      <rect x="416" y="296" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="296" width="144" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="424" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="438" y="312" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NVM</text>
      <text x="488" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Journal</text>
      <text x="488" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">survit à la coupure</text>

      <!-- Connectivité : à trancher -->
      <rect x="592" y="296" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="296" width="144" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="600" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="614" y="312" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
      <text x="664" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Connectivité</text>
      <text x="664" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Wi-Fi ? pont ?</text>

      <!-- Alimentation : barre transversale, aucune flèche -->
      <rect x="240" y="400" width="496" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="400" width="496" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="248" y="408" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="266" y="416" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PWR</text>
      <text x="488" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alimentation — sous toutes les briques, forme à trancher</text>

      <!-- Service : extérieur -->
      <rect x="800" y="296" width="120" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="296" width="120" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="808" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="822" y="312" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
      <text x="860" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
      <text x="860" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">le pool</text>

      <!-- Légende -->
      <line x1="32" y1="556" x2="928" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <rect x="136" y="568" width="16" height="8" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IMPOSÉ PAR LA CONSOLE</text>

      <rect x="376" y="568" width="16" height="8" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="400" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NÉCESSAIRE, FORME À TRANCHER</text>

      <rect x="672" y="568" width="16" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="696" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LÀ OÙ TOURNE PROTOCOL</text>
    </svg>
  </div>
</body>
</html>
