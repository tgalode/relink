<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Évolution par échange</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Séquence · relink · parcours 1 sur 4</p>
    <h1>Évolution par échange — sans réseau, sans compte, sans serveur</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relink-sequence-evolution-title relink-sequence-evolution-desc">
      <title id="relink-sequence-evolution-title">Évolution par échange</title>
      <desc id="relink-sequence-evolution-desc">Séquence d'un échange où le module joue le partenaire local : la cartouche négocie, les deux équipes sont échangées, le joueur propose son Pokémon, le module synthétise une offre sans rien demander au réseau, les deux côtés acceptent et la cartouche déclenche l'évolution.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="280" y1="144" x2="280" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="144" x2="680" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="280" y1="184" x2="680" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="416" y="164" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x01 · NÉGOCIATION</text>

      <line x1="680" y1="220" x2="280" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="424" y="200" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x02 · SUIVEUR</text>

      <line x1="280" y1="256" x2="680" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="404" y="236" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="244" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOC D'ÉCHANGE · 415 O</text>

      <line x1="680" y1="292" x2="280" y2="292" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="412" y="272" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SON ÉQUIPE · 415 O</text>

      <line x1="280" y1="328" x2="680" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="404" y="308" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x60+i · POKÉMON CÉDÉ</text>

      <!-- Self : le partenaire est fabriqué sur place -->
      <path d="M 684,364 H 716 Q 724,364 724,372 V 388 Q 724,396 716,396 H 688"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="736" y="368" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="376" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PARTENAIRE SYNTHÉTISÉ SUR PLACE</text>

      <line x1="680" y1="428" x2="280" y2="428" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="416" y="408" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x60 · SON OFFRE</text>

      <line x1="280" y1="464" x2="680" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="444" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x62 · ACCORD</text>

      <line x1="680" y1="500" x2="280" y2="500" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="424" y="480" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="488" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x62 · ACCORD</text>

      <!-- Self : la cartouche fait évoluer -->
      <path d="M 284,524 H 316 Q 324,524 324,532 V 548 Q 324,556 316,556 H 288"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="336" y="528" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="536" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ÉVOLUTION · SAUVEGARDE</text>

      <!-- Acteurs -->
      <rect x="200" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartouche</text>
      <text x="280" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rouge/Bleu/Jaune</text>

      <rect x="600" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="88" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="680" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Module</text>
      <text x="680" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">protocol · hors ligne</text>

      <!-- Légende -->
      <line x1="32" y1="580" x2="928" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <line x1="136" y1="600" x2="168" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="180" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">APPEL</text>

      <line x1="336" y1="600" x2="368" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="380" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RÉPONSE</text>

      <line x1="536" y1="600" x2="568" y2="600" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="580" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">L'ÉCHANGE EST CONCLU</text>
    </svg>
  </div>
</body>
</html>
