<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépôt dans le pool</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Séquence · relink · parcours 2 sur 4</p>
    <h1>Dépôt dans le pool — la cartouche cède d'abord, le service commite ensuite</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relink-sequence-depot-title relink-sequence-depot-desc">
      <title id="relink-sequence-depot-title">Dépôt dans le pool</title>
      <desc id="relink-sequence-depot-desc">Séquence d'un dépôt : le module présente un leurre, la cartouche cède son Pokémon, le module annonce l'échange au service qui l'inscrit au pool par un commit idempotent, puis acquitte. Si l'acquittement se perd, le rejeu retombe sur le même commit et ne duplique rien.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="160" y1="144" x2="160" y2="548" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="144" x2="480" y2="548" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="144" x2="800" y2="548" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Fragment : le rejeu -->
      <rect x="456" y="428" width="368" height="104" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="456" y="428" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="476" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="468" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[SI L'ACQUITTEMENT SE PERD]</text>

      <!-- Messages -->
      <line x1="160" y1="184" x2="480" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="164" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOC D'ÉCHANGE · 415 O</text>

      <line x1="480" y1="220" x2="160" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="256" y="200" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UN LEURRE · 415 O</text>

      <line x1="160" y1="256" x2="480" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="236" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="244" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x60+i · POKÉMON CÉDÉ</text>

      <line x1="480" y1="292" x2="160" y2="292" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="264" y="272" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="280" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x62 · ACCORD</text>

      <line x1="480" y1="328" x2="800" y2="328" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="568" y="308" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ÉCHANGE CONCLU · MQTT</text>

      <!-- Self : le commit -->
      <path d="M 804,364 H 836 Q 844,364 844,372 V 388 Q 844,396 836,396 H 808"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="368" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="376" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">COMMIT IDEMPOTENT</text>

      <line x1="800" y1="428" x2="480" y2="428" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="592" y="408" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACQUITTEMENT</text>

      <line x1="480" y1="500" x2="800" y2="500" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="576" y="480" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="488" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJEU · MÊME COMMIT</text>

      <!-- Acteurs -->
      <rect x="80" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="160" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartouche</text>
      <text x="160" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rouge/Bleu/Jaune</text>

      <rect x="400" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="480" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Module</text>
      <text x="480" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">firmware · protocol</text>

      <rect x="720" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
      <text x="800" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">application · pool</text>

      <!-- Légende -->
      <line x1="32" y1="576" x2="928" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <line x1="136" y1="596" x2="168" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="180" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">APPEL</text>

      <line x1="300" y1="596" x2="332" y2="596" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="344" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RÉPONSE</text>

      <line x1="480" y1="596" x2="512" y2="596" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="524" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASYNCHRONE</text>

      <line x1="680" y1="596" x2="712" y2="596" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="724" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">L'ÉCHANGE EST CONCLU</text>
    </svg>
  </div>
</body>
</html>
