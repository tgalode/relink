<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Échange direct entre deux joueurs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Séquence · relink · parcours 4 sur 4</p>
    <h1>Échange direct — la cartouche patiente pendant que le réseau traverse</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relink-sequence-direct-title relink-sequence-direct-desc">
      <title id="relink-sequence-direct-title">Échange direct entre deux joueurs</title>
      <desc id="relink-sequence-direct-desc">Séquence d'un échange relayé : le module tient l'équipe du joueur distant et répond à vitesse fil, seule la décision traverse le réseau. Tant que le joueur distant n'a pas tranché, le module présente l'octet neutre et la cartouche patiente sans échéance, puis l'accord conclut l'échange. Le côté distant est représenté par un seul participant.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="144" x2="120" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="144" x2="360" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="144" x2="600" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="144" x2="840" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Fragment : l'attente, sans échéance -->
      <rect x="96" y="352" width="288" height="100" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="96" y="352" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="116" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="108" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[TANT QUE B N'A PAS TRANCHÉ]</text>

      <!-- Messages -->
      <line x1="120" y1="184" x2="360" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="168" y="164" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOC D'ÉCHANGE · 415 O</text>

      <line x1="360" y1="220" x2="120" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="168" y="200" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L'ÉQUIPE DE B · 415 O</text>

      <line x1="120" y1="256" x2="360" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="176" y="236" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="244" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x60+i · L'OFFRE DE A</text>

      <line x1="360" y1="292" x2="600" y2="292" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="416" y="272" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L'OFFRE DE A · MQTT</text>

      <line x1="600" y1="328" x2="840" y2="328" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="680" y="308" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELAIE</text>

      <line x1="360" y1="424" x2="120" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="168" y="404" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="412" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x00 · IL N'A PAS CHOISI</text>

      <line x1="840" y1="488" x2="600" y2="488" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="664" y="468" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="476" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SON VERDICT</text>

      <line x1="600" y1="524" x2="360" y2="524" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="424" y="504" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="512" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT · MQTT</text>

      <line x1="360" y1="560" x2="120" y2="560" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="184" y="540" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="548" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0x62 · ACCORD</text>

      <!-- Acteurs -->
      <rect x="40" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartouche A</text>
      <text x="120" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rouge/Bleu/Jaune</text>

      <rect x="280" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="88" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="360" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Module A</text>
      <text x="360" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tient l'équipe de B</text>

      <rect x="520" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
      <text x="600" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">relais</text>

      <rect x="760" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="840" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Joueur B</text>
      <text x="840" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">module + cartouche</text>

      <!-- Légende -->
      <line x1="32" y1="596" x2="928" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <line x1="136" y1="616" x2="168" y2="616" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="180" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">APPEL</text>

      <line x1="300" y1="616" x2="332" y2="616" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="344" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RÉPONSE</text>

      <line x1="480" y1="616" x2="512" y2="616" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="524" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASYNCHRONE</text>

      <line x1="680" y1="616" x2="712" y2="616" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="724" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">L'ÉCHANGE EST CONCLU</text>
    </svg>
  </div>
</body>
</html>
