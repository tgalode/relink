<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture de relink</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · relink</p>
    <h1>Le module se fait passer pour un partenaire d'échange</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relink-architecture-title relink-architecture-desc">
      <title id="relink-architecture-title">Architecture de relink</title>
      <desc id="relink-architecture-desc">Une cartouche Game Boy dialogue par câble link avec un module dont le firmware s'appuie sur le crate protocol ; le service, bâti sur le crate application, reçoit les échanges par ses adaptateurs et conserve les Pokémon déposés dans un pool, tandis qu'une application mobile passe par les mêmes adaptateurs. Le crate protocol est le seul code partagé entre le module et le service.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="216" y="88" width="232" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="304" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="100" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MODULE</text>

      <rect x="512" y="88" width="232" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="600" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="100" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE</text>

      <!-- Connecteurs (dessinés avant les boîtes) -->

      <!-- Cartouche <-> Firmware : l'échange est simultané dans les deux sens -->
      <line x1="184" y1="156" x2="248" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <rect x="200" y="136" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="144" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINK</text>

      <!-- Firmware -> protocol -->
      <line x1="332" y1="192" x2="332" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="340" y="212" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHAQUE OCTET</text>

      <!-- Firmware -> Adaptateurs -->
      <line x1="416" y1="156" x2="544" y2="156" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="464" y="136" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="144" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MQTT</text>

      <!-- Adaptateurs -> application -->
      <line x1="628" y1="192" x2="628" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="636" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PORTS</text>

      <!-- Adaptateurs -> Pool -->
      <line x1="712" y1="156" x2="792" y2="156" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- application -> protocol : le seul code partagé -->
      <line x1="544" y1="292" x2="416" y2="292" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="456" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="280" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MÊME CODE</text>

      <!-- Application mobile -> Adaptateurs, avec un saut au croisement -->
      <path d="M 184,472 H 464 Q 472,472 472,464 V 300 a 8,8 0 0,0 0,-16 V 184 Q 472,176 480,176 H 544"
            fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="308" y="452" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <!-- Nœuds -->

      <!-- Cartouche : extérieur au projet -->
      <rect x="32" y="120" width="152" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="120" width="152" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="40" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="54" y="136" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GB</text>
      <text x="108" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartouche</text>
      <text x="108" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rouge/Bleu/Jaune</text>

      <!-- Firmware : à venir -->
      <rect x="248" y="120" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="120" width="168" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="256" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="272" y="136" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCU</text>
      <text x="332" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firmware</text>
      <text x="332" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thumbv7em</text>

      <!-- protocol : le cœur partagé, focal -->
      <rect x="248" y="248" width="168" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="248" width="168" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="256" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="274" y="264" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRATE</text>
      <text x="332" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">protocol</text>
      <text x="332" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no_std · sans alloc</text>
      <text x="332" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">codecs · machine à états</text>

      <!-- Adaptateurs : à venir -->
      <rect x="544" y="120" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="120" width="168" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="552" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="566" y="136" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">I/O</text>
      <text x="628" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adaptateurs</text>
      <text x="628" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MQTT · HTTP · base</text>

      <!-- application : livré -->
      <rect x="544" y="248" width="168" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="248" width="168" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="552" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="570" y="264" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRATE</text>
      <text x="628" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">application</text>
      <text x="628" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">std · ports en traits</text>
      <text x="628" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dépôt · réservation</text>

      <!-- Pool : à venir -->
      <rect x="792" y="120" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="120" width="128" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="800" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="812" y="136" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="856" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pool</text>
      <text x="856" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dépôts en attente</text>

      <!-- Application mobile : à venir -->
      <rect x="32" y="440" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="440" width="152" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="40" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="54" y="456" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="108" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile</text>
      <text x="108" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">choix à l'avance</text>

      <!-- Légende -->
      <line x1="32" y1="556" x2="928" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <rect x="136" y="568" width="16" height="8" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LIVRÉ ET TESTÉ</text>

      <rect x="336" y="568" width="16" height="8" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESTE À FAIRE</text>

      <rect x="536" y="568" width="16" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="560" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PARTAGÉ MODULE ET SERVICE</text>

      <rect x="760" y="568" width="16" height="8" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="784" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTÉRIEUR</text>
    </svg>
  </div>
</body>
</html>
