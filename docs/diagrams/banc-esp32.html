<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banc ESP32 — liaison d'essai GPIO25 ↔ GPIO18</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Relink · Schéma · Banc firmware</p>
    <h1>Banc ESP32 — liaison d'essai GPIO25 ↔ GPIO18</h1>

    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banc-esp32-title banc-esp32-desc">
      <title id="banc-esp32-title">Banc ESP32 — liaison d'essai GPIO25 ↔ GPIO18</title>
      <desc id="banc-esp32-desc">Schéma électrique du banc de mesure : un unique strap relie la broche D25 de la carte ESP32, configurée en sortie, à sa broche D18, configurée en entrée. La masse est commune par construction et le montage tient entièrement en 3,3 volts ; aucun composant externe n'est requis.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cadre de feuille -->
      <rect x="32" y="32" width="896" height="496" fill="none" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- ============ U1 : la carte ============ -->
      <text x="304" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">U1</text>
      <rect x="304" y="128" width="256" height="256" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="432" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ESP32-WROOM-32</text>
      <text x="432" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">carte DevKit · 38 broches</text>

      <!-- Broches gauche : alimentation -->
      <line x1="256" y1="160" x2="304" y2="160" stroke="#2d3142" stroke-width="1.2"/>
      <text x="316" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">3V3</text>
      <line x1="256" y1="352" x2="304" y2="352" stroke="#2d3142" stroke-width="1.2"/>
      <text x="316" y="356" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">GND</text>

      <!-- Broches droite : les deux du banc -->
      <line x1="560" y1="192" x2="608" y2="192" stroke="#2d3142" stroke-width="1.2"/>
      <text x="548" y="196" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">D25</text>
      <text x="568" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SORTIE</text>

      <line x1="560" y1="288" x2="608" y2="288" stroke="#2d3142" stroke-width="1.2"/>
      <text x="548" y="292" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">D18</text>
      <text x="568" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ENTRÉE, PULL-DOWN INTERNE</text>

      <!-- ============ Symbole d'alimentation +3V3 ============ -->
      <line x1="256" y1="160" x2="256" y2="132" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="240" y1="132" x2="272" y2="132" stroke="#2d3142" stroke-width="1.2"/>
      <text x="256" y="124" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+3V3</text>

      <!-- ============ Symbole de masse ============ -->
      <line x1="256" y1="352" x2="256" y2="384" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="240" y1="384" x2="272" y2="384" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="246" y1="390" x2="266" y2="390" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="252" y1="396" x2="260" y2="396" stroke="#2d3142" stroke-width="1.2"/>
      <text x="256" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GND COMMUN</text>

      <!-- ============ Le net : le seul fil à poser ============ -->
      <path d="M 608,192 H 672 V 288 H 608" fill="none" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="688" y="228" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SCK_TEST</text>
      <text x="688" y="252" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Le seul fil à poser :</text>
      <text x="688" y="272" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">un strap mâle-mâle.</text>

      <!-- ============ Notes ============ -->
      <line x1="48" y1="432" x2="616" y2="432" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="48" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NOTES</text>
      <text x="48" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1 — La masse est déjà commune : les deux broches sont sur la même carte.</text>
      <text x="48" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">2 — Pull-down de D18 interne au MCU, activé par firmware. Aucune résistance.</text>
      <text x="48" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">3 — Montage entièrement en 3,3 V : aucune adaptation de niveau à ce stade.</text>
      <text x="48" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">4 — Repérer D25 et D18 à la sérigraphie : l'ordre varie selon la révision.</text>

      <!-- ============ Cartouche ============ -->
      <rect x="640" y="432" width="288" height="96" fill="none" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="652" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RELINK · BANC FIRMWARE</text>
      <text x="652" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Liaison d'essai GPIO25 ↔ GPIO18</text>
      <line x1="640" y1="484" x2="928" y2="484" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="652" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RÉV. A</text>
      <text x="740" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">2026-09-11</text>
      <text x="916" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">FEUILLE 1/1</text>
    </svg>
  </div>
</body>
</html>
